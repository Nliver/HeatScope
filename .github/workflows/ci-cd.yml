name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit 评论需要写权限
  pull-requests: write # PR 评论
  issues: write # PR 评论走 issues API
  security-events: write # gitleaks 上报

concurrency:
  group: heatscope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-test:
    name: Frontend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Check diff whitespace
        run: git diff --check

      - name: Build frontend
        run: npm run build

      - name: Upload GitHub build artifact
        uses: actions/upload-artifact@v6
        with:
          name: heatscope-next-build-${{ github.sha }}
          path: apps/web/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-build:
    name: GitHub deployment build gate
    needs: [frontend-test, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified frontend artifact
        uses: actions/download-artifact@v6
        with:
          name: heatscope-next-build-${{ github.sha }}
          path: apps/web/.next

      - name: Verify build artifact
        working-directory: apps/web
        run: test -f .next/BUILD_ID

  vercel-pr-comment:
    name: Comment Vercel preview on PR
    needs: [frontend-test, secret-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel preview deployment and comment on PR
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          MARKER="<!-- vercel-preview -->"
          STATE=""
          URL=""
          INSPECTOR=""
          for i in $(seq 1 60); do
            sleep 10
            RESPONSE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=10")

            # 按 PR head commit 的 SHA 精确匹配本次 preview 部署
            DEPLOY=$(echo "$RESPONSE" | jq -r --arg sha "$HEAD_SHA" \
              '.deployments[] | select(.meta.githubCommitSha == $sha) | select(.target != "production") | {readyState, url, inspectorUrl} | tojson' | head -1)

            STATE=$(echo "$DEPLOY" | jq -r '.readyState // empty')
            URL=$(echo "$DEPLOY" | jq -r '.url // empty')
            INSPECTOR=$(echo "$DEPLOY" | jq -r '.inspectorUrl // empty')

            if [ "$STATE" = "READY" ] || [ "$STATE" = "ERROR" ]; then break; fi
          done

          if [ "$STATE" = "READY" ]; then
            BODY=$(cat <<EOF
          ${MARKER}
          ## 🚀 预览部署就绪

          | 项目 | 状态 |
          |------|------|
          | 预览地址 | https://${URL} |
          | 分支 | ${HEAD_REF} |
          | 构建日志 | ${INSPECTOR} |

          > CI 检查已通过，预览部署由 Vercel 自动触发。
          EOF
            )
          elif [ "$STATE" = "ERROR" ]; then
            BODY=$(cat <<EOF
          ${MARKER}
          ## ❌ 预览部署失败

          | 项目 | 状态 |
          |------|------|
          | 分支 | ${HEAD_REF} |
          | 构建日志 | ${INSPECTOR} |
          EOF
            )
          else
            BODY=$(cat <<EOF
          ${MARKER}
          ## ⏳ 预览部署超时

          10 分钟内未等到 Vercel 部署结果，请前往 Vercel Dashboard 查看。
          EOF
            )
          fi

          # 同一 PR 多次 push 时更新旧评论而不是重复发新评论
          EXISTING_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id' | head -1)

          if [ -n "$EXISTING_ID" ]; then
            curl -s -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/issues/comments/${EXISTING_ID}" \
              -d "$(jq -n --arg b "$BODY" '{body: $b}')" > /dev/null
          else
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -d "$(jq -n --arg b "$BODY" '{body: $b}')" > /dev/null
          fi

          echo "Final preview state: ${STATE:-TIMEOUT}"

  vercel-production-comment:
    name: Comment Vercel production deployment
    needs: [frontend-test, secret-scan, github-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel production deployment and comment on commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://shiz-zeta.vercel.app
        run: |
          STATE=""
          INSPECTOR=""
          for i in $(seq 1 60); do
            sleep 10
            RESPONSE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=10")

            # 按 commit SHA 精确匹配本次 production 部署
            DEPLOY=$(echo "$RESPONSE" | jq -r --arg sha "$COMMIT_SHA" \
              '.deployments[] | select(.meta.githubCommitSha == $sha) | select(.target == "production") | {readyState, inspectorUrl} | tojson' | head -1)

            STATE=$(echo "$DEPLOY" | jq -r '.readyState // empty')
            INSPECTOR=$(echo "$DEPLOY" | jq -r '.inspectorUrl // empty')

            if [ "$STATE" = "READY" ] || [ "$STATE" = "ERROR" ]; then break; fi
          done

          if [ "$STATE" = "READY" ]; then
            BODY=$(cat <<EOF
          <!-- vercel-production -->
          ## ✅ 生产环境部署就绪

          | 项目 | 状态 |
          |------|------|
          | 线上地址 | ${PRODUCTION_URL} |
          | Commit | ${COMMIT_SHA:0:7} |
          | 构建日志 | ${INSPECTOR} |

          > CI 检查已通过，生产部署由 Vercel 自动触发。
          EOF
            )
          elif [ "$STATE" = "ERROR" ]; then
            BODY=$(cat <<EOF
          <!-- vercel-production -->
          ## ❌ 生产环境部署失败

          | 项目 | 状态 |
          |------|------|
          | Commit | ${COMMIT_SHA:0:7} |
          | 构建日志 | ${INSPECTOR} |
          EOF
            )
          else
            BODY=$(cat <<EOF
          <!-- vercel-production -->
          ## ⏳ 生产部署超时

          10 分钟内未等到 Vercel 部署结果，请前往 Vercel Dashboard 查看。
          EOF
            )
          fi

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/commits/${COMMIT_SHA}/comments" \
            -d "$(jq -n --arg b "$BODY" '{body: $b}')" > /dev/null

          echo "Final production state: ${STATE:-TIMEOUT}"
